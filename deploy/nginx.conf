# HTTP 模式（預設）。啟用 HTTPS 時於主機環境檔設定 NGINX_CONF=nginx-https.conf。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    # 僅供容器內健康檢查，兩種模式都以此埠檢查。
    listen 127.0.0.1:8081;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;

    # Let's Encrypt 以 HTTP 驗證時讀取的檔案。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    include /etc/nginx/parcel-locations.conf;
}
