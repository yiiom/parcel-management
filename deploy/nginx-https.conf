# HTTPS 模式。憑證須已存在於 /etc/letsencrypt/live/parcel，否則 Nginx 無法啟動。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # 憑證續期仍以 HTTP 驗證，不可轉址。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    # 僅供容器內健康檢查，不經 TLS。
    listen 127.0.0.1:8081;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;

    ssl_certificate /etc/letsencrypt/live/parcel/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parcel/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:parcel_tls:5m;
    ssl_session_timeout 1h;

    include /etc/nginx/parcel-locations.conf;
}
