name: Parcel CI and EC2 deployment

on:
  push:
    branches: [main, master]
    paths:
      - frontend/**
      - backend/**
      - deploy/**
      - .github/workflows/deploy.yml
  pull_request:
    paths:
      - frontend/**
      - backend/**
      - deploy/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      frontend_image: ${{ steps.publish.outputs.frontend_image }}
      backend_image: ${{ steps.publish.outputs.backend_image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 驗證部署工具
        run: |
          python3 -m unittest discover -s deploy/tests -v
          for file in deploy/*.sh; do bash -n "$file"; done
      - name: 登入 GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # 以目錄內容的 Git tree SHA 當映像標籤；倉庫已有相同標籤代表內容未變更。
      - name: 判斷前端與後端是否變更
        id: plan
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          for service in frontend backend; do
            image="ghcr.io/$owner/parcel-$service:$(git rev-parse "HEAD:$service")"
            if docker manifest inspect "$image" >/dev/null 2>&1; then
              build=false
              echo "- $service：未變更，沿用既有映像" >> "$GITHUB_STEP_SUMMARY"
            else
              build=true
              echo "- $service：有變更，重新建置" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "${service}_image=$image" >> "$GITHUB_OUTPUT"
            echo "${service}_build=$build" >> "$GITHUB_OUTPUT"
          done
      - name: 前端：檢查、編譯並打包映像
        if: steps.plan.outputs.frontend_build == 'true'
        env:
          IMAGE: ${{ steps.plan.outputs.frontend_image }}
        run: >-
          docker build --platform linux/amd64 -f frontend/Dockerfile.prod
          --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          -t "$IMAGE" frontend
      - name: 前端未變更：取用既有映像
        if: steps.plan.outputs.frontend_build != 'true'
        env:
          IMAGE: ${{ steps.plan.outputs.frontend_image }}
        run: docker pull "$IMAGE"
      - name: 後端：檢查、編譯並打包映像
        if: steps.plan.outputs.backend_build == 'true'
        env:
          IMAGE: ${{ steps.plan.outputs.backend_image }}
        run: >-
          docker build --platform linux/amd64 -f backend/Dockerfile.prod
          --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          -t "$IMAGE" backend
      - name: 後端未變更：取用既有映像
        if: steps.plan.outputs.backend_build != 'true'
        env:
          IMAGE: ${{ steps.plan.outputs.backend_image }}
        run: docker pull "$IMAGE"
      - name: 驗證前端 後端與 MySQL 串接
        env:
          FRONTEND_IMAGE: ${{ steps.plan.outputs.frontend_image }}
          BACKEND_IMAGE: ${{ steps.plan.outputs.backend_image }}
        run: bash deploy/ci-smoke.sh "$GITHUB_SHA" "$FRONTEND_IMAGE" "$BACKEND_IMAGE"
      # 通過串接檢查才推送；部署一律使用不可變的 digest。
      - name: 推送新映像並記錄 digest
        id: publish
        if: github.event_name != 'pull_request'
        env:
          FRONTEND_IMAGE: ${{ steps.plan.outputs.frontend_image }}
          BACKEND_IMAGE: ${{ steps.plan.outputs.backend_image }}
          FRONTEND_BUILD: ${{ steps.plan.outputs.frontend_build }}
          BACKEND_BUILD: ${{ steps.plan.outputs.backend_build }}
        run: |
          digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])'
          }
          if [[ "$FRONTEND_BUILD" == true ]]; then docker push "$FRONTEND_IMAGE"; fi
          if [[ "$BACKEND_BUILD" == true ]]; then docker push "$BACKEND_IMAGE"; fi
          frontend_digest=$(digest "$FRONTEND_IMAGE")
          backend_digest=$(digest "$BACKEND_IMAGE")
          echo "frontend_image=${FRONTEND_IMAGE%:*}@$frontend_digest" >> "$GITHUB_OUTPUT"
          echo "backend_image=${BACKEND_IMAGE%:*}@$backend_digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: ci
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: parcel-management-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      EC2_HOST: 54.199.27.86
      EC2_USER: ubuntu
      # 部署後的公開檢查網址；主機已啟用 HTTPS，HTTP 會轉址。
      APP_BASE_URL: https://54.199.27.86
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 部署至 EC2 並驗證
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_IMAGE: ${{ needs.ci.outputs.frontend_image }}
          BACKEND_IMAGE: ${{ needs.ci.outputs.backend_image }}
        run: bash deploy/ssh-deploy.sh
