  "responses":
    "Error400":
      "description": "邀請碼或取件碼無效。"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
          "example":
            "code": "INVALID_CODE"
            "message": "邀請碼或取件碼無效。"
    "Error401":
      "description": "請先登入，或帳號密碼不正確。"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
          "example":
            "code": "UNAUTHENTICATED"
            "message": "請先登入，或帳號密碼不正確。"
    "Error403":
      "description": "你沒有權限執行此操作。"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
          "example":
            "code": "FORBIDDEN"
            "message": "你沒有權限執行此操作。"
    "Error404":
      "description": "找不到資料。"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
          "example":
            "code": "NOT_FOUND"
            "message": "找不到資料。"
    "Error409":
      "description": "資料重複，或目前狀態不允許此操作。"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
          "example":
            "code": "CONFLICT"
            "message": "資料重複，或目前狀態不允許此操作。"
    "Error410":
      "description": "取件驗證已過期，請重新驗證。"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
          "example":
            "code": "VERIFICATION_EXPIRED"
            "message": "取件驗證已過期，請重新驗證。"
    "Error422":
      "description": "輸入資料格式不正確。"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
          "example":
            "code": "VALIDATION_ERROR"
            "message": "輸入資料格式不正確。"
    "Error429":
      "description": "嘗試次數過多，請稍後再試。"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
          "example":
            "code": "TOO_MANY_REQUESTS"
            "message": "嘗試次數過多，請稍後再試。"
      "headers":
        "Retry-After":
          "description": "距離可重試的剩餘秒數。"
          "schema":
            "type": "integer"
            "minimum": 0
    "Error500":
      "description": "系統暫時無法完成操作。"
      "content":
        "application/json":
          "schema":
            "$ref": "#/components/schemas/Error"
          "example":
            "code": "INTERNAL_ERROR"
            "message": "系統暫時無法完成操作。"
