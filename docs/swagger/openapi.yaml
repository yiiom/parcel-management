  "/api/auth/login":
    "post":
      "tags":
        - "帳號與登入"
      "operationId": "login"
      "summary": "登入"
      "description": "**開發階段：第 2 階段**\n\n**可使用角色：** 未登入者亦可\n\n驗證Email、密碼與帳號啟用；HttpOnly Cookie登入自成功起8小時有效，到期重新登入。各裝置獨立，不回傳密碼或JWT。"
      "x-roles": []
      "responses":
        "200":
          "description": "操作成功。"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/User"
          "headers":
            "Set-Cookie":
              "description": "正式環境須 HTTPS；Cookie 使用 HttpOnly、Secure、SameSite=Lax、Path=/。 Max-Age=28800；後端也需驗證8小時絕對期限。"
              "schema":
                "type": "string"
                "example": "access_token=<token>; Max-Age=28800; Path=/; HttpOnly; Secure; SameSite=Lax"
        "401":
          "$ref": "#/components/responses/Error401"
        "422":
          "$ref": "#/components/responses/Error422"
        "429":
          "$ref": "#/components/responses/Error429"
        "500":
          "$ref": "#/components/responses/Error500"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/LoginRequest"
      "security": []
      "x-development-phase": 2
  "/api/auth/logout":
    "post":
