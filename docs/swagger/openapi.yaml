      "description": "**開發階段：第 2 階段**\n\n**可使用角色：** 系統管理員\n\n只供系統管理員的管理員管理畫面使用，包含已分配與未分配的building_admin帳號。操作者選姓名與大樓，前端保存並傳送user_id，不要求使用者輸入ID或Email。調任沿用先取消原分配再指派新大樓；第二步失敗需顯示未分配狀態並可重試，不能顯示調任成功。"
      "x-roles":
        - "系統管理員"
      "responses":
        "200":
          "description": "操作成功。"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/AdminDirectoryPage"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "422":
          "$ref": "#/components/responses/Error422"
        "500":
          "$ref": "#/components/responses/Error500"
      "parameters":
        -
          "name": "page"
          "in": "query"
          "required": false
          "description": ""
          "schema":
            "type": "integer"
            "minimum": 1
            "default": 1
        -
          "name": "page_size"
          "in": "query"
          "required": false
          "description": ""
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 100
            "default": 20
      "x-development-phase": 2
