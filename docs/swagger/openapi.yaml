      "description": "**開發階段：第 3 階段**\n\n**可使用角色：** 大樓管理員\n\n檢查帳號啟用、大樓管理權、唯一有效取件碼、包裹 pending、入住批次有效。建立 10 分鐘驗證，包裹仍待領取，碼尚未失效。同包裹只有一筆有效驗證；同管理員重試回傳既有結果，另一管理員遇有效驗證回傳 409。過期需重新核對現場狀況再驗證。\n\n同一帳號對此類碼連續失敗5次，暫停對應驗證功能5分鐘，回傳429與Retry-After；不暫停其他功能或其他帳號。邀請碼驗證與確認加入共用失敗計數，取件碼另計。"
