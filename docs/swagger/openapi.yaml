      "summary": "住戶確認收到包裹"
      "description": "**開發階段：第 3 階段**\n\n**可使用角色：** 住戶\n\n無需 request body。先檢查當下登入帳號啟用、resident、有效資格及未結束批次，資格批次須與包裹相同。新簽收再檢查驗證 awaiting_confirmation、未過期與包裹 pending。同一交易完成唯一簽收、保存簽收者及經手管理員當時姓名、包裹 picked_up、驗證 completed，使碼失效。簽收者取自登入帳號、時間由系統取得。驗證和簽收的 parcel_id 必須一致。同一簽收者在仍具存取權時重試回傳原成功結果；另一同戶成員回傳 409（已簽收）；已失去資格回傳 403。並行確認只能成功一次。未完成驗證過期回傳 410，須重新確認現場情況後再驗證。\n只由住戶本人確認，管理員不得代簽。現場未確認先留櫃檯；已交付未簽收先記錄異常並聯絡核對，恢復流程後仍由有資格的住戶確認，不能繞過入住或資格限制。"
